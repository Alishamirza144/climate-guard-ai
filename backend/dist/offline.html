<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClimateGuard AI — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071b2d;
        --panel: rgba(13, 30, 47, 0.8);
        --text: #eaf7ff;
        --muted: #98a7b8;
        --lime: #a7f3d0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: radial-gradient(circle at top, #0c2740, var(--bg));
        color: var(--text);
      }
      .card {
        width: min(92vw, 520px);
        padding: 2rem;
        border-radius: 24px;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 25px 80px rgba(0,0,0,0.35);
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 5vw, 2.8rem); }
      p { margin: 0; color: var(--muted); line-height: 1.6; }
      .badge {
        display: inline-block;
        padding: 0.45rem 0.8rem;
        border-radius: 999px;
        background: rgba(167, 243, 208, 0.12);
        border: 1px solid rgba(167, 243, 208, 0.4);
        color: var(--lime);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.7rem;
        margin-bottom:1rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Offline mode</div>
      <h1>ClimateGuard AI</h1>
      <p>You are offline. The most recent dashboard data may be available from the last synced session, but live risk updates are temporarily unavailable.</p>
    </main>
  </body>
</html>
