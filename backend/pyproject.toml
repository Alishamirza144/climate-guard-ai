[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climateguard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "scikit-learn>=1.4.2",
    "xgboost>=2.0.3",
    "joblib>=1.4.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "cachetools>=5.3.3",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.108.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app.engines --cov=app.ml --cov-report=term-missing --cov-fail-under=85"
markers = [
    "live: requires live external API access",
]
