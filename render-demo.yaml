services:
  - type: web
    name: climateguard-demo
    env: python
    region: oregon
    plan: free
    branch: demo-sky-blue
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.onrender.com"
      - key: LOG_LEVEL
        value: INFO

  - type: static
    name: climateguard-skyblue-frontend
    region: oregon
    plan: free
    branch: demo-sky-blue
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      - key: VITE_API_URL
        value: https://climateguard-demo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

